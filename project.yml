name: UPEMA
options:
  bundleIdPrefix: es.angelsoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    VERSIONING_SYSTEM: apple-generic
targets:
  UPEMA:
    type: application
    platform: iOS
    sources:
      - path: UPEMA
        excludes:
          - Resources
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
          - Info.plist
      - path: UPEMA/Resources
        buildPhase: resources
      - path: UPEMA/Assets.xcassets
        buildPhase: resources
      - path: UPEMA/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.angelsoto.upema
        INFOPLIST_FILE: UPEMA/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  UPEMATests:
    type: bundle.unit-test
    platform: iOS
    sources: [UPEMATests]
    dependencies:
      - target: UPEMA
