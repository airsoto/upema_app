name: iOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Validate catalog
        run: python3 scripts/verify_catalog.py
      - name: Build
        run: xcodebuild -project UPEMA.xcodeproj -scheme UPEMA -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Verify app icon metadata
        run: |
          APP_INFO=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/UPEMA.app/Info.plist' -print -quit)
          APP_DIR=$(dirname "$APP_INFO")
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP_INFO")
          test "$ICON_NAME" = "AppIcon"
          test -f "$APP_DIR/Assets.car"
          test -f "$APP_DIR/discografia.json"
