workflows:
  ios-testflight:
    name: UPEMA · TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Create this integration with this exact name in Codemagic.
      app_store_connect: upema_app_store

    environment:
      groups:
        # Contains the App Store Connect API credentials used by the integration.
        - app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: es.angelsoto.upema
      vars:
        BUNDLE_ID: "es.angelsoto.upema"
        APP_STORE_APPLE_ID: "6839390735"
        XCODE_PROJECT: "UPEMA.xcodeproj"
        XCODE_SCHEME: "UPEMA"
      xcode: 26.6

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate

      - name: Validate catalog
        script: python3 scripts/verify_catalog.py

      - name: Configure App Store signing
        script: xcode-project use-profiles

      - name: Set next App Store build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER=""
          if ! LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --platform=IOS); then
            echo "Aviso: no se pudo consultar el último build de App Store Connect."
          fi
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "App Store Connect no devolvió un build; se usará el número de CodeMagic."
            LATEST_BUILD_NUMBER=0
          fi

          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          CODEMAGIC_BUILD_NUMBER=${BUILD_NUMBER:-0}
          if [[ "$CODEMAGIC_BUILD_NUMBER" =~ ^[0-9]+$ ]] && [ "$CODEMAGIC_BUILD_NUMBER" -gt "$NEXT_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER=$CODEMAGIC_BUILD_NUMBER
          fi
          if [ "$NEXT_BUILD_NUMBER" -lt 2 ]; then
            NEXT_BUILD_NUMBER=2
          fi

          echo "App Store Connect tiene el build $LATEST_BUILD_NUMBER."
          echo "CodeMagic está ejecutando el build ${BUILD_NUMBER:-desconocido}; se generará el build $NEXT_BUILD_NUMBER."
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

          RESOLVED_BUILD_NUMBER=$(xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | awk '/CURRENT_PROJECT_VERSION/ { print $3; exit }')
          if [ "$RESOLVED_BUILD_NUMBER" != "$NEXT_BUILD_NUMBER" ]; then
            echo "El proyecto conserva el build $RESOLVED_BUILD_NUMBER en lugar de $NEXT_BUILD_NUMBER."
            exit 1
          fi

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Verify app icon metadata
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -name '*.ipa' -print -quit)
          VERIFY_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APP_INFO=$(find "$VERIFY_DIR/Payload" -name Info.plist -print -quit)
          APP_DIR=$(dirname "$APP_INFO")
          ARCHIVE_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO")
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP_INFO")
          if ! [[ "$ARCHIVE_BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$ARCHIVE_BUILD_NUMBER" -lt 2 ]; then
            echo "El IPA contiene un número de build no válido: $ARCHIVE_BUILD_NUMBER"
            exit 1
          fi
          echo "El IPA contiene el build $ARCHIVE_BUILD_NUMBER."
          if [ "$ICON_NAME" != "AppIcon" ]; then
            echo "App icon metadata is missing from the archived application."
            exit 1
          fi
          if [ ! -f "$APP_DIR/Assets.car" ]; then
            echo "The compiled asset catalog is missing from the archived application."
            exit 1
          fi
          if [ ! -f "$APP_DIR/discografia.json" ]; then
            echo "The music catalog is missing from the archived application."
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect/TestFlight but keep review and release manual.
        submit_to_testflight: false
        submit_to_app_store: false
